name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that all files were uploaded
        shell: bash
        run: |
          missing=0
          for f in package.json main.js preload.js app/index.html scripts/copy-vendor.js; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "Upload the missing file(s) to the repository, keeping the same folder, then run again."; exit 1; fi
          echo "All files are present."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages (also copies the offline libraries)
        run: npm install
      - name: Build the Setup installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: Khanika-Hostel-Manager-Setup
          path: dist/*.exe
